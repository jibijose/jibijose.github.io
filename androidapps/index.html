<script>
  // 1. Fill your project URL and ANON key (Project Settings -> API -> anon public)
  const SUPABASE_URL = "https://hfprnenkpqekftgxqgrp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // <-- Paste your anon key here
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const requestedApp = urlParams.get('app') || 'batteryapp';

  async function init() {
    const statusArea = document.getElementById('status-area');

    try {
      // Check current session
      const { data: { session }, error: sessionError } = await supabase.auth.getSession();
      if (sessionError) throw sessionError;

      if (!session) {
        // Show Sign-in button (prevents incognito pop-up/redirect blockers)
        statusArea.innerHTML = `
          <p>Please sign in with your Google account to download <strong>${requestedApp}</strong>.</p>
          <button class="btn" id="login-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
          </button>
        `;

        document.getElementById('login-btn').addEventListener('click', async () => {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.href
            }
          });
          if (error) {
            alert("Google Sign-In Error: " + error.message);
          }
        });
        return;
      }

      // Signed in: verify permissions and start download
      const userEmail = session.user.email;
      statusArea.innerHTML = `
        <div class="loader"></div>
        <p>Signed in as <strong>${userEmail}</strong></p>
        <p>Checking permissions for <strong>${requestedApp}</strong>...</p>
      `;

      const { data: files, error: listError } = await supabase.storage
        .from('apks')
        .list(requestedApp, { limit: 10, sortBy: { column: 'created_at', order: 'desc' } });

      if (listError || !files || files.length === 0) {
        throw new Error(`No APK found for '${requestedApp}', or you do not have permission.`);
      }

      const latestApk = files[0].name;
      const fullPath = `${requestedApp}/${latestApk}`;

      const { data: signData, error: signError } = await supabase.storage
        .from('apks')
        .createSignedUrl(fullPath, 300);

      if (signError || !signData?.signedUrl) {
        throw new Error(`Access Denied: ${userEmail} is not authorized to download ${requestedApp}.`);
      }

      statusArea.innerHTML = `
        <p style="color: #4ade80; font-weight: 600;">Permission Verified!</p>
        <p>Downloading <strong>${latestApk}</strong>...</p>
        <a class="btn" href="${signData.signedUrl}">Click here if download doesn't start</a>
      `;
      window.location.href = signData.signedUrl;

    } catch (err) {
      statusArea.innerHTML = `
        <p class="error">${err.message}</p>
        <button class="btn" onclick="supabase.auth.signOut().then(() => location.reload())">Try another account</button>
      `;
    }
  }

  init();
</script>
